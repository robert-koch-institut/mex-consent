services:
  mex-consent-frontend:
    build:
      context: .
    image: mex-consent:local
    ports:
      - 8040:8040
    healthcheck:
      # the entrypoint downloads bun, installs the npm packages and runs a
      # production build before serving, hence the long start period
      test: [ "CMD", "python", "-c", "import requests; requests.get('http://localhost:8040').raise_for_status()" ]
      interval: 30s
      start_interval: 5s
      timeout: 5s
      retries: 3
      start_period: 360s
    entrypoint: consent-frontend
    depends_on:
      mex-consent-api:
        condition: service_healthy
  mex-consent-api:
    build:
      context: .
    image: mex-consent:local
    ports:
      - 8041:8041
    environment:
      - MEX_CONSENT_API_HOST=0.0.0.0
      # keep in sync with .github/workflows/testing.yml
      - MEX_BACKEND_API_KEY=write_key
      - MEX_BACKEND_API_URL=http://mex-backend:8080/
      - MEX_IDENTITY_PROVIDER=backend
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; requests.get('http://localhost:8041/_system/check').raise_for_status()" ]
      interval: 30s
      start_interval: 2s
      timeout: 5s
      retries: 3
      start_period: 30s
    entrypoint: consent-api
    depends_on:
      mex-backend:
        condition: service_healthy
  mex-backend:
    image: ghcr.io/robert-koch-institut/mex-backend:4.5.0@sha256:d7b0c83343047a818f4d1435abbe5e240d99e44d67f56043054dc3e932323a4b
    ports:
      - 8080:8080
    environment:
      - MEX_BACKEND_API_KEY_DATABASE={"read":["read_key"],"write":["write_key"]}
      - MEX_DEBUG=True
      - MEX_GRAPH_URL=neo4j://neo4j:7687
      - MEX_IDENTITY_PROVIDER=graph
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; requests.get('http://localhost:8080/v0/_system/check').raise_for_status()" ]
      interval: 30s
      start_interval: 2s
      timeout: 5s
      retries: 3
      start_period: 30s
    # the testing backend mocks ldap and serves the graph flush endpoint,
    # both of which the integration test suite relies on
    entrypoint: testing-backend
    depends_on:
      neo4j:
        condition: service_healthy
  neo4j:
    image: neo4j:2026.08-community@sha256:eabfbb042bdaca2fd5e1950db1329b22c794eee80f0eacc4e7a729d44b2e863f
    environment:
      - NEO4J_AUTH=neo4j/password
    ports:
      - 7687:7687
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: [ "CMD", "cypher-shell", "-u", "neo4j", "-p", "password", "RETURN 1" ]
      interval: 30s
      start_interval: 2s
      timeout: 5s
      retries: 3
      start_period: 30s
volumes:
  neo4j_data:
